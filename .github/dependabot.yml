version: 2
# Held back on purpose, in both npm trees:
# - react, react-dom and their types stay on 18: the vis-2 host supplies React as a
#   module-federation singleton, 18 in older and 19 in newer versions (ioBroker.vis-2#689). The
#   bundle's React 18 copies are only fallbacks, which a 19 host never loads (test/package-custom.js
#   checks that), while a build against 19 fails on hosts with 18.
# - typescript stays on 6.0: typescript-eslint supports <6.1, and TS 7 has no lib/typescript.js.
# - @iobroker/types-vis-2, vite and @module-federation/vite are updated by hand: a new version may
#   build different chunks on Linux and Windows, which fails the build-is-current job, and
#   @module-federation/vite decides whether the React 18 fallbacks load eagerly. vite and
#   @module-federation/vite follow vis2-materialdesign; types-vis-2 is ahead of it (2.20 has no
#   dependencies, 2.14 pulled vite 7 and MUI 6 into the tree).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: 13 4 8 * *
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    versioning-strategy: increase
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      - dependency-name: 'react'
        update-types:
          - version-update:semver-major
      - dependency-name: 'react-dom'
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/react'
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/react-dom'
        update-types:
          - version-update:semver-major
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: '@iobroker/types-vis-2'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: 37 4 8 * *
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
  - package-ecosystem: npm
    directory: /src-widgets-ts
    schedule:
      interval: cron
      cronjob: 19 4 8 * *
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    versioning-strategy: increase
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      - dependency-name: 'react'
        update-types:
          - version-update:semver-major
      - dependency-name: 'react-dom'
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/react'
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/react-dom'
        update-types:
          - version-update:semver-major
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: '@iobroker/types-vis-2'
      - dependency-name: 'vite'
      - dependency-name: '@module-federation/vite'
